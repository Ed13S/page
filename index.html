
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exam Timer</title>

<style>
body {
  margin: 0;
  font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
  background: #111;
  color: #fff;
  text-align: center;
  overflow: hidden;
  transition: background 0.3s;
}

#topbar {
  display: flex;
  justify-content: space-between;
  padding: 15px 30px;
  background: #1a1a1a;
  border-bottom: 1px solid #333;
  font-size: 14px;
}

h1 {
  margin: 20px 0 10px;
  font-weight: 500;
  color: #fff;
  letter-spacing: 1px;
}

.timer-label {
  font-size: 1.2rem;
  color: #888;
  margin-bottom: -5px;
  text-transform: uppercase;
  letter-spacing: 2px;
}

.timer {
  font-size: 140px;
  font-weight: 700;
  margin: 0;
  font-family: monospace;
}

.finish-time {
  font-size: 1.3rem;
  color: #aaa;
  margin-top: -10px;
  letter-spacing: 1px;
}

.finish-time strong {
  color: #fff;
}

.container {
  display: flex;
  justify-content: center;
  gap: 40px;
  margin: 20px 0;
}

.box {
  border: 1px solid #333;
  padding: 20px;
  width: 220px;
  border-radius: 12px;
  background: #161616;
  transition: all 0.5s ease;
}

.box.active-phase {
  background: #e0e0e0;
  color: #000;
  border-color: #fff;
  box-shadow: 0 0 25px rgba(255,255,255,0.1);
}

.reading-title {
  font-weight: bold;
  display: inline-block;
  margin-bottom: 8px;
  font-size: 0.85rem;
  border-bottom: 3px solid #2ecc71;
  padding-bottom: 2px;
}

.writing-title {
  font-weight: bold;
  display: inline-block;
  margin-bottom: 8px;
  font-size: 0.85rem;
  border-bottom: 3px solid #3498db;
  padding-bottom: 2px;
}

#barContainer {
  width: 85%;
  height: 40px;
  margin: 25px auto;
  background: #333;
  border-radius: 8px;
  position: relative;
  overflow: hidden;
  border: 2px solid #444;
}

#writingBar {
  position: absolute;
  height: 100%;
  background: #3498db;
  width: 100%;
  left: 0;
  z-index: 1;
}

#readingBar {
  position: absolute;
  height: 100%;
  background: #2ecc71;
  width: 100%;
  right: 0;
  z-index: 2;
}

button {
  margin: 5px;
  padding: 12px 25px;
  font-size: 15px;
  border-radius: 6px;
  border: none;
  cursor: pointer;
  font-weight: 600;
}

.play {
  background: #2ecc71;
  color: #000;
}

.pause {
  background: #f1c40f;
  color: #000;
}

.stop {
  background: #e74c3c;
  color: #fff;
}

.alarm-btn {
  background: #ff4757;
  color: #fff;
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

input {
  background: #222;
  border: 1px solid #444;
  color: #fff;
  padding: 10px;
  width: 60px;
  border-radius: 4px;
  text-align: center;
}

.flash {
  animation: flashBg 0.4s alternate infinite;
}

@keyframes flashBg {
  from { background: #111; }
  to { background: #700; }
}

#awakeStatus {
  color: #2ecc71;
  font-size: 12px;
  margin-top: 12px;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<div id="topbar">
  <div>Eddie Singh</div>
  <div id="clockDisplay"></div>
</div>

<h1>Exam Timer</h1>

<div class="container">

  <div id="readBox" class="box">
    <span class="reading-title">READING TIME</span>
    <div id="readDisplay" style="font-size:1.8rem;font-weight:600;">00:00</div>
  </div>

  <div id="writeBox" class="box">
    <span class="writing-title">WRITING TIME</span>
    <div id="writeDisplay" style="font-size:1.8rem;font-weight:600;">00:00</div>
  </div>

</div>

<div id="phaseLabel" class="timer-label">Ready</div>

<div class="timer" id="mainTimer">00:00</div>

<div id="finishDisplay" class="finish-time"></div>

<div id="barContainer">
  <div id="writingBar"></div>
  <div id="readingBar"></div>
</div>

<div class="controls">

  <button onclick="setSession(15, 90)">15 + 90</button>
  <button onclick="setSession(5, 50)">5 + 50</button>
  <button onclick="setSession(15, 120)">15 + 120</button>

  <br><br>

  Reading:
  <input type="number" id="readIn" value="15" min="0">

  Writing:
  <input type="number" id="writeIn" value="90" min="0">

  <button onclick="applyCustom()">Set Custom</button>

  <br><br>

  <button id="mainBtn" class="play" onclick="handlePrimaryAction()">▶ START</button>

  <button class="stop" onclick="resetToStart()">RESET</button>

  <div id="awakeStatus">● SCREEN AWAKE MODE: STANDBY</div>

</div>

<script>

let rSec = 0;
let wSec = 0;
let phase = 'reading';
let timerLeft = 0;
let interval = null;
let alarming = false;

let wakeLock = null;

const mainBtn = document.getElementById('mainBtn');
const mainTimer = document.getElementById('mainTimer');
const phaseLabel = document.getElementById('phaseLabel');
const rBar = document.getElementById('readingBar');
const wBar = document.getElementById('writingBar');
const awakeStatus = document.getElementById('awakeStatus');


// SCREEN WAKE LOCK

async function requestWakeLock() {
  try {
    if ('wakeLock' in navigator && !wakeLock) {

      wakeLock = await navigator.wakeLock.request('screen');

      awakeStatus.textContent = '● SCREEN AWAKE MODE: ACTIVE';
      awakeStatus.style.color = '#2ecc71';

      wakeLock.addEventListener('release', () => {
        wakeLock = null;

        if (interval && !alarming) {
          awakeStatus.textContent = '● SCREEN AWAKE MODE: RECONNECTING';
        } else {
          awakeStatus.textContent = '● SCREEN AWAKE MODE: STANDBY';
        }
      });

    }
  } catch (err) {
    console.log('Wake Lock unavailable:', err);

    awakeStatus.textContent = '● SCREEN AWAKE MODE: UNAVAILABLE';
    awakeStatus.style.color = '#e74c3c';
  }
}

async function releaseWakeLock() {
  if (wakeLock) {
    const lock = wakeLock;
    wakeLock = null;
    await lock.release();
  }

  awakeStatus.textContent = '● SCREEN AWAKE MODE: STANDBY';
  awakeStatus.style.color = '#888';
}


// RECONNECT WAKE LOCK WHEN RETURNING TO TAB

document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && interval && !alarming) {
    requestWakeLock();
  }
});


// CLOCK AND FINISH TIME

function updateFinish() {
  const el = document.getElementById('finishDisplay');

  if (alarming || (rSec === 0 && wSec === 0)) {
    el.textContent = '';
    return;
  }

  const remaining = timerLeft + (phase === 'reading' ? wSec : 0);

  const end = new Date(Date.now() + remaining * 1000);

  const t = end.toLocaleTimeString([], {
    hour: 'numeric',
    minute: '2-digit'
  });

  const label = interval ? 'Expected finish' : 'Finish if started now';

  el.innerHTML = `${label}: <strong>${t}</strong>`;
}

function updateClock() {
  document.getElementById('clockDisplay').textContent =
    new Date().toLocaleTimeString();

  updateFinish();
}

setInterval(updateClock, 1000);
updateClock();


// TIME FORMATTING

function format(s) {
  let m = Math.floor(s / 60);
  let sec = s % 60;

  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}


// SET SESSION

function setSession(r, w) {

  fullReset();

  rSec = Math.max(0, Math.floor(r * 60));
  wSec = Math.max(0, Math.floor(w * 60));

  document.getElementById('readDisplay').textContent = format(rSec);
  document.getElementById('writeDisplay').textContent = format(wSec);

  if (rSec > 0) {
    phase = 'reading';
    timerLeft = rSec;
  } else {
    phase = 'writing';
    timerLeft = wSec;
  }

  mainTimer.textContent = format(timerLeft);

  refreshUI();
  updateFinish();
}


// CUSTOM SESSION

function applyCustom() {

  const r = Math.max(0, parseFloat(document.getElementById('readIn').value) || 0);
  const w = Math.max(0, parseFloat(document.getElementById('writeIn').value) || 0);

  setSession(r, w);
}


// REFRESH DISPLAY

function refreshUI() {

  if (phase === 'reading') {

    document.getElementById('readBox').classList.add('active-phase');
    document.getElementById('writeBox').classList.remove('active-phase');

    phaseLabel.textContent = 'Reading Time';

    rBar.style.display = 'block';

  } else {

    document.getElementById('writeBox').classList.add('active-phase');
    document.getElementById('readBox').classList.remove('active-phase');

    phaseLabel.textContent = 'Writing Time';

    rBar.style.display = 'none';

  }
}


// MAIN BUTTON

function handlePrimaryAction() {

  if (alarming) {
    stopAlarm();
    return;
  }

  if (!interval) {

    if (timerLeft <= 0 && wSec <= 0) return;

    if (document.documentElement.requestFullscreen) {
      document.documentElement.requestFullscreen().catch(() => {});
    }

    start();

  } else {

    pause();

  }
}


// START TIMER

function start() {

  requestWakeLock();

  mainBtn.textContent = '⏸ PAUSE';
  mainBtn.className = 'pause';

  interval = setInterval(tick, 1000);

  updateFinish();
}


// PAUSE TIMER

function pause() {

  clearInterval(interval);
  interval = null;

  releaseWakeLock();

  mainBtn.textContent = '▶ RESUME';
  mainBtn.className = 'play';

  updateFinish();
}


// TIMER COUNTDOWN

function tick() {

  if (timerLeft > 0) {

    timerLeft--;

    mainTimer.textContent = format(timerLeft);

    if (phase === 'reading') {

      rBar.style.width = (rSec > 0 ? timerLeft / rSec * 100 : 0) + '%';
      wBar.style.width = '100%';

    } else {

      wBar.style.width = (wSec > 0 ? timerLeft / wSec * 100 : 0) + '%';

    }

    if ([300, 120, 60].includes(timerLeft)) {

      document.body.classList.add('flash');

      setTimeout(() => {
        document.body.classList.remove('flash');
      }, 1000);

    }

  } else {

    if (phase === 'reading' && wSec > 0) {

      phase = 'writing';
      timerLeft = wSec;

      refreshUI();

      mainTimer.textContent = format(timerLeft);

      document.body.classList.add('flash');

      setTimeout(() => {
        document.body.classList.remove('flash');
      }, 800);

    } else {

      finish();

    }

  }

  updateFinish();
}


// FINISH

function finish() {

  clearInterval(interval);
  interval = null;

  releaseWakeLock();

  alarming = true;

  document.body.classList.add('flash');

  mainBtn.textContent = '🛑 STOP ALARM';
  mainBtn.className = 'alarm-btn';

  phaseLabel.textContent = 'Time Up';

  mainTimer.textContent = '00:00';

  updateFinish();
}


// STOP ALARM

function stopAlarm() {

  alarming = false;

  document.body.classList.remove('flash');

  resetToStart();
}


// RESET TO ORIGINAL SESSION

function resetToStart() {

  setSession(rSec / 60, wSec / 60);

}


// FULL RESET

function fullReset() {

  clearInterval(interval);
  interval = null;

  releaseWakeLock();

  alarming = false;

  document.body.classList.remove('flash');

  mainBtn.textContent = '▶ START';
  mainBtn.className = 'play';

  rBar.style.width = '100%';
  wBar.style.width = '100%';

  refreshUI();
}


// INITIAL SESSION

setSession(15, 90);

</script>

</body>
</html>
